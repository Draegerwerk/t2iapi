name: Build, Test and Deploy

on:
  pull_request:
  push:

jobs:
  build-java:
    uses: ./.github/workflows/build-java.yml

  build-python:
    uses: ./.github/workflows/build-python.yml

  integration-tests:
    needs: [build-java, build-python]
    uses: ./.github/workflows/integration-test.yml

  verify-tag-version:
    uses: ./.github/workflows/verify-tag-version.yml

  deploy-java:
    needs: [integration-tests, verify-tag-version]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/deploy-java.yml
    secrets: inherit

  deploy-python:
    needs: [integration-tests, verify-tag-version]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/deploy-python.yml
    secrets: inherit

  github-release:
    needs: [deploy-java, deploy-python]
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/github-release.yml